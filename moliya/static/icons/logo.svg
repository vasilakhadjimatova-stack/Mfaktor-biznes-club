<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- fon: tungi ko'k-qora, yuqoridan oltin nur -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d2e"/>
      <stop offset=".55" stop-color="#0d1120"/>
      <stop offset="1" stop-color="#080a13"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".08" r=".9">
      <stop offset="0" stop-color="#f6d489" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#f6d489" stop-opacity=".05"/>
      <stop offset="1" stop-color="#f6d489" stop-opacity="0"/>
    </radialGradient>
    <!-- oltin: yorug'dan to'q sariga -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e0a0"/>
      <stop offset=".45" stop-color="#eec161"/>
      <stop offset="1" stop-color="#c8912f"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9b3"/>
      <stop offset="1" stop-color="#d9a538"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="dglow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#f6d489" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- fon (burchaklari PNG bosqichida qirqiladi) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- banknot gilyoshiga ishora: nozik halqalar -->
  <g fill="none" stroke="#f6d489" stroke-opacity=".055">
    <circle cx="452" cy="70" r="150" stroke-width="1.4"/>
    <circle cx="452" cy="70" r="196" stroke-width="1.2"/>
    <circle cx="452" cy="70" r="244" stroke-width="1"/>
    <circle cx="46" cy="470" r="130" stroke-width="1.4"/>
    <circle cx="46" cy="470" r="178" stroke-width="1.2"/>
  </g>
  <!-- ichki nozik hoshiya -->
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none"
        stroke="#f6d489" stroke-opacity=".16" stroke-width="2"/>

  <!-- M monogrammasi -->
  <g filter="url(#soft)">
    <path fill="url(#gold)" d="
      M124,352 L124,160 L192,160 L256,262 L320,160 L388,160 L388,352
      L338,352 L338,240 L282,330 L230,330 L174,240 L174,352 Z"/>
    <!-- yuqori qirra yaltirashi -->
    <path fill="#fff" fill-opacity=".18" d="
      M124,160 L192,160 L256,262 L320,160 L388,160 L388,176 L328,176
      L256,290 L184,176 L124,176 Z"/>
  </g>

  <!-- olmos — brend belgisi -->
  <g filter="url(#dglow)">
    <path fill="url(#gold2)" d="M256,376 L286,410 L256,444 L226,410 Z"/>
    <path fill="#fff" fill-opacity=".28" d="M256,376 L286,410 L256,410 Z"/>
  </g>
</svg>
