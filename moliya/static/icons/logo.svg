<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mfaktor belgisi: qizil tog' cho'qqili «M» (brend logosidan) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d29"/>
      <stop offset=".55" stop-color="#0e1119"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".18" r=".85">
      <stop offset="0" stop-color="#ff4838" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#ff4838" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ff4838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5544"/>
      <stop offset="1" stop-color="#d61f1f"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#d61f1f" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g filter="url(#soft)">
    <path d="M84 360 L204 152 L262 240 L332 118 L448 360"
          fill="none" stroke="url(#peak)" stroke-width="42"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="256" y="432" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="86" letter-spacing="4" fill="#f2f4fb">Faktor</text>
</svg>
