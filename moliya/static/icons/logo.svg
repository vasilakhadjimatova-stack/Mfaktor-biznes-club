      <stop offset="0" stop-color="#fefdfa"/>
      <stop offset=".55" stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#f1ebdd"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- zarhal ichki hoshiya -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none"
