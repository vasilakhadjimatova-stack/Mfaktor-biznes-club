<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish — {{ company_name }}</title>
<style>
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#0c0e13;
  color:#e9e7e2;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;box-sizing:border-box}
.card{max-width:360px;width:100%;background:#161a24;border:1px solid #262b38;
  border-radius:16px;padding:36px 32px;text-align:center}
.brand{font-size:26px;font-weight:800;margin-bottom:4px}
.brand b{color:#d4af37}
.sub{font-size:12px;color:#8b8fa3;margin-bottom:26px}
input{width:100%;box-sizing:border-box;background:#12151d;color:#e9e7e2;
  border:1px solid #262b38;border-radius:10px;padding:13px;font-size:20px;
  text-align:center;letter-spacing:6px;margin-bottom:14px}
input:focus{outline:none;border-color:#d4af37}
button{width:100%;background:#d4af37;color:#14161c;border:none;border-radius:10px;
  padding:12px;font-size:15px;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.08)}
.err{background:rgba(248,113,113,.12);color:#f87171;border:1px solid #f87171;
  border-radius:9px;padding:8px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
  <form class="card" method="POST">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="brand"><b>M</b>faktor ERP</div>
    <div class="sub">{{ company_tagline }}</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="err">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <input name="code" inputmode="numeric" maxlength="6" placeholder="••••••"
           autofocus autocomplete="off">
    <button type="submit">Kirish</button>
  </form>
</body>
</html>
